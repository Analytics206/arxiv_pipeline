services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  neo4j:
    profiles:
      - manual
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/password
    restart: unless-stopped

  api:
    image: arxiv_pipeline-python:latest
    build:
      context: .
      target: runtime
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mongodb
      - qdrant
    environment:
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017/
      - MONGO_DB=arxiv_papers
      - MONGO_COLLECTION=papers
      - MONGO_TRACKING_COLLECTION=vector_processed_pdfs
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=arxiv_papers
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - AI_SERVICES_HOST=${AI_SERVICES_DOCKER_HOST:-host.docker.internal}
      - AI_SERVICES_OLLAMA_PORT=${AI_SERVICES_OLLAMA_PORT:-11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:4b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
      - QDRANT_RESEARCH_COLLECTION=${QDRANT_RESEARCH_COLLECTION:-research_knowledge_hybrid_v1}
      - PDF_STORAGE_DIR=${PDF_STORAGE_DIR:-data/pdfs}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - ENABLE_LEGACY_CYPHER_API=${ENABLE_LEGACY_CYPHER_API:-false}
      - ENABLE_LEGACY_MUTATION_API=${ENABLE_LEGACY_MUTATION_API:-false}
    volumes:
      - ./config:/app/config
      - ./src:/app/src:ro
    ports:
      - "${RESEARCH_API_BIND:-0.0.0.0}:${RESEARCH_API_PORT:-8000}:8000"

  # Thin read-only protocol adapter. It has no database credentials and calls
  # only the canonical REST API, preserving one business-logic path.
  mcp:
    image: arxiv_pipeline-python:latest
    build:
      context: .
      target: runtime
    command:
      - python
      - -m
      - src.mcp_server.server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    depends_on:
      - api
    environment:
      - RESEARCH_API_URL=http://api:8000
      - RESEARCH_MCP_API_TIMEOUT=${RESEARCH_MCP_API_TIMEOUT:-30}
    volumes:
      - ./src:/app/src:ro
    ports:
      - "${RESEARCH_MCP_BIND:-0.0.0.0}:${RESEARCH_MCP_PORT:-8001}:8001"
    restart: unless-stopped

  # Canonical rebuildable hybrid index. CPU mode is sufficient for storage
  # and retrieval; embeddings are generated by the shared Ollama service.
  qdrant:
   image: qdrant/qdrant:latest
   ports:
     - "6333:6333"
     - "6334:6334"
   volumes:
     # Keep Qdrant on Docker's native Linux filesystem. Bind mounts under
     # Windows/OneDrive can reject atomic segment renames during optimization.
     - qdrant_native_data:/qdrant/storage
   restart: unless-stopped
   # GPU Support configuration - commented out due to WSL GPU compatibility issues
   # deploy:
   #   resources:
   #     reservations:
   #       devices:
   #         - driver: nvidia
   #           count: 1
   #           capabilities: [gpu]
   environment:
   #   - CUDA_VISIBLE_DEVICES=1  # Use second GPU
     - QDRANT_ENABLE_CUDA=false # Disable CUDA support

  app:
    profiles:
      - manual
    image: arxiv_pipeline-python:latest
    depends_on:
      - mongodb
      - qdrant
    environment:
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017/
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - QDRANT_URL=http://qdrant:6333
      - AI_SERVICES_HOST=${AI_SERVICES_DOCKER_HOST:-host.docker.internal}
      - AI_SERVICES_OLLAMA_PORT=${AI_SERVICES_OLLAMA_PORT:-11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:4b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
      - QDRANT_RESEARCH_COLLECTION=${QDRANT_RESEARCH_COLLECTION:-research_knowledge_hybrid_v1}
      - PDF_STORAGE_DIR=${PDF_STORAGE_DIR:-data/pdfs}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./evals:/app/evals:ro
      - ./src:/app/src:ro

  # Post-import corpus preparation. It is read-only unless --apply is passed;
  # --index additionally builds a complete physical discovery collection and
  # activates its stable alias only after count validation succeeds.
  prepare-kaggle:
    profiles:
      - manual
    image: arxiv_pipeline-python:latest
    build:
      context: .
      target: runtime
    entrypoint:
      - python
      - -m
      - src.pipeline.prepare_kaggle_corpus
    depends_on:
      - mongodb
      - qdrant
    environment:
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017/
      - MONGO_DB=arxiv_papers
      - KAGGLE_RETAINED_CATEGORIES=${KAGGLE_RETAINED_CATEGORIES:-}
      - QDRANT_URL=http://qdrant:6333
      - AI_SERVICES_HOST=${AI_SERVICES_DOCKER_HOST:-host.docker.internal}
      - AI_SERVICES_OLLAMA_PORT=${AI_SERVICES_OLLAMA_PORT:-11434}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
    volumes:
      - ./config:/app/config:ro
      - ./src:/app/src:ro

  # Resumable discovery-only worker. Run with `docker compose --profile manual
  # up -d index-kaggle`; transient service failures restart from the MongoDB
  # checkpoint, while a successful completed index exits without restarting.
  index-kaggle:
    profiles:
      - manual
    image: arxiv_pipeline-python:latest
    build:
      context: .
      target: runtime
    entrypoint:
      - python
      - -m
      - src.pipeline.index_arxiv_discovery
    depends_on:
      - mongodb
      - qdrant
    environment:
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017/
      - MONGO_DB=arxiv_papers
      - QDRANT_URL=http://qdrant:6333
      - AI_SERVICES_HOST=${AI_SERVICES_DOCKER_HOST:-host.docker.internal}
      - AI_SERVICES_OLLAMA_PORT=${AI_SERVICES_OLLAMA_PORT:-11434}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
    volumes:
      - ./config:/app/config:ro
      - ./src:/app/src:ro
    restart: on-failure:10
      
  sync-mongodb:
    profiles:
      - manual
    image: arxiv_pipeline-python:latest
    command: python -m src.pipeline.sync_mongodb --config /app/config/default.yaml
    depends_on:
      - mongodb
    environment:
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017/
      - MONGO_URI=mongodb://mongodb:27017/
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./src:/app/src:ro
      
  sync-neo4j:
    profiles:
      - manual
    image: arxiv_pipeline-python:latest
    command: python -m src.graph.sync_mongo_to_neo4j
    depends_on:
      - mongodb
      - neo4j
    environment:
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017/
      
  sync-bertopic:
    profiles:
      - legacy
    image: arxiv_pipeline-legacy:latest
    command: python -m src.pipeline.insert_bertopic_mongodb --config /app/config/default.yaml
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      
  sync-top2vec:
    profiles:
      - legacy
    image: arxiv_pipeline-legacy:latest
    command: python -m src.pipeline.insert_top2vec_mongodb --config /app/config/default.yaml
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      
  sync-qdrant:
    profiles:
      - legacy
    image: arxiv_pipeline-legacy:latest
    command: python -m src.pipeline.sync_qdrant
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - QDRANT_URL=http://qdrant:6333
      - AI_SERVICES_HOST=${AI_SERVICES_DOCKER_HOST:-host.docker.internal}
      - AI_SERVICES_OLLAMA_PORT=${AI_SERVICES_OLLAMA_PORT:-11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:4b}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./src:/app/src:ro
    depends_on:
      - mongodb
      - qdrant

  # Build owner only for the retired BERTopic, Top2Vec, and historical
  # Hugging Face/Qdrant embedding processes.
  legacy-runtime:
    profiles:
      - legacy
    image: arxiv_pipeline-legacy:latest
    build:
      context: .
      target: legacy
    command: python -c "print('Legacy runtime image is ready.')"

  web-ui:
    build:
      context: ./src/web-ui
      dockerfile: Dockerfile
    ports:
      - "${RESEARCH_UI_BIND:-0.0.0.0}:${RESEARCH_UI_PORT:-3000}:3000"
    depends_on:
      - api
      
  jupyter-scipy:
    profiles:
      - manual
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./config:/home/jovyan/work/config
      - ./data:/home/jovyan/work/data
      - ./src:/home/jovyan/work/src
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017/
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - QDRANT_URL=http://host.docker.internal:6333
    depends_on:
      - mongodb
      - neo4j
      - qdrant

  zookeeper:
    profiles:
      - manual
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    restart: unless-stopped

  kafka:
    profiles:
      - manual
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    
  kafka-ui:
    profiles:
      - manual
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: arxiv-pipeline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
    driver_opts:
      type: none
      device: ./docker_volumes/mongo_data
      o: bind
    name: arxiv_pipeline_mongo_data
    labels:
      - "project=arxiv_pipeline"
      - "database=mongodb"
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      device: ./docker_volumes/neo4j_data
      o: bind
    name: arxiv_pipeline_neo4j_data
    labels:
      - "project=arxiv_pipeline"
      - "database=neo4j"
  qdrant_data:
    # Legacy bind-mounted storage retained as a non-destructive rollback copy.
    driver: local
    driver_opts:
      type: none
      device: ./docker_volumes/qdrant_data
      o: bind
    name: arxiv_pipeline_qdrant_data
    labels:
      - "project=arxiv_pipeline"
      - "database=qdrant"
      - "vector=embeddings"
  qdrant_native_data:
    driver: local
    name: arxiv_pipeline_qdrant_native_data
    labels:
      - "project=arxiv_pipeline"
      - "database=qdrant"
      - "vector=embeddings"
      - "storage=native"
  zookeeper_data:
    driver: local
    driver_opts:
      type: none
      device: ./docker_volumes/zookeeper_data
      o: bind
    name: arxiv_pipeline_zookeeper_data
    labels:
      - "project=arxiv_pipeline"
      - "service=kafka"
      - "component=zookeeper"
  zookeeper_log:
    driver: local
    driver_opts:
      type: none
      device: ./docker_volumes/zookeeper_log
      o: bind
    name: arxiv_pipeline_zookeeper_log
    labels:
      - "project=arxiv_pipeline"
      - "service=kafka"
      - "component=zookeeper"
      - "type=logs"
  kafka_data:
    driver: local
    driver_opts:
      type: none
      device: ./docker_volumes/kafka_data
      o: bind
    name: arxiv_pipeline_kafka_data
    labels:
      - "project=arxiv_pipeline"
      - "service=kafka"
