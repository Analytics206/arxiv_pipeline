# ArXiv Pipeline Configuration

# MongoDB settings
mongo:
  connection_string: "mongodb://mongodb:27017/"
  connection_string_local: "mongodb://localhost:27017/"
  db_name: "arxiv_papers"

# Shared stateless AI services. Environment variables override these values.
ai_services:
  host_local: "localhost"
  host_docker: "host.docker.internal"
  ollama_port: 11434

# Agent-first paper analysis settings
analysis:
  collection_name: "paper_analyses"
  schema_version: "1.0"
  prompt_version: "agent-paper-v5"
  model: "qwen3.5:4b"
  context_length: 12288
  max_output_tokens: 4096
  # Used only after a response is confirmed truncated. Normal calls retain the
  # smaller settings above; the retry has room for long synthesis JSON.
  retry_context_length: 18432
  retry_max_output_tokens: 6144
  chunk_max_chars: 12000
  cache_directory: "data/analysis_cache"

# Rebuildable, agent-facing hybrid index over canonical MongoDB analyses.
research_index:
  collection_name: "research_knowledge_hybrid_v1"
  schema_version: "2.1"
  embedding_model: "mxbai-embed-large:latest"
  embedding_batch_size: 32
  query_prefix: "Represent this sentence for searching relevant passages: "
  retrieval_mode: "hybrid"
  hybrid:
    candidate_multiplier: 4
    candidate_minimum: 50
    dense_weight: 1.1
    sparse_weight: 1.0
    rrf_k: 60
    paper_diversity_penalty: 0.2
    # Excludes single-retriever leftovers by default. Callers can request 0 to
    # inspect every nearest neighbor while retaining normalized relevance.
    default_min_relevance: 0.05

# Bounded, resumable agent analysis after the larger PDF corpus is downloaded.
# One paper per category is a safe three-paper batch on the 8 GB GPU. Completed
# analysis identities are skipped, so each rerun advances to the next papers.
research_processing:
  # Category selection comes only from KAGGLE_RETAINED_CATEGORIES in .env.
  papers_per_category: 1
  
# Optional legacy graph settings. Neo4j is not part of the default agent-facing
# serving path and should be started only for a measured graph experiment.
neo4j:
  url: "bolt://neo4j:7687"
  url_local: "bolt://localhost:7687"
  user: "neo4j"
  password: "password"

# Shared Qdrant service. The canonical serving path owns two complementary
# collections through research_index and discovery_index below; the retired
# arxiv_papers PDF-vector collection is not created or queried.
qdrant:
  url: "http://qdrant:6333"
  url_local: "http://localhost:6333"

# One paper-centric serving policy over both complementary Qdrant collections.
research_search:
  candidate_multiplier: 6
  candidate_minimum: 50
  evidence_weight: 1.0
  discovery_weight: 1.0
  rrf_k: 60
  evidence_items_per_paper: 3
  token_budget: 12000
  maximum_abstract_chars: 2400
  history:
    enabled: true
    runs_collection: "research_search_runs"
    source_pulls_collection: "research_search_source_pulls"
    outputs_collection: "research_search_outputs"

# Append-only judgments returned by the external research harness. Authentication
# is enabled only when RESEARCH_FEEDBACK_BEARER_TOKEN is non-empty.
research_feedback:
  collection_name: "harness_feedback"
  papers_collection: "papers"
  kaggle_collection: "arxiv_kaggle"
  analyses_collection: "paper_analyses"

# ArXiv API settings 
arxiv:
  categories: # used in sync_mongodb.py
    # - "cs.AI"
    # - "cs.CV"
    # - "cs.DB"
    # - "cs.DS"
    # - "cs.LG" 
    # - "cs.MA"
    # - "cs.NE"
    # - "cs.RO"
    - "cs.SE"
  max_results: 200 # Number of papers to fetch per category loop, 200 is max but can fail so set to 100
  sort_by: "submittedDate"
  sort_order: "descending"
  max_iterations: 50 # Number of times to loop the pipeline for each category above
  rate_limit_seconds: 3 # seconds to wait between api calls
  start_date: "2026-01-01" # Inclusive submittedDate lower bound sent to the arXiv API
  end_date: "2026-07-31" # Inclusive submittedDate upper bound sent to the arXiv API
  max_no_papers: 10 # Maximum number of no paper fetches before breaking loop for category
# Embedding model settings
embedding:
  model_name: "all-MiniLM-L6-v2"  # Smaller model to start with
  batch_size: 200

# 265,979 papers in arxiv_papers.papers
# PDF storage settings
pdf_storage:
  directory: "data/pdfs" # ignored runtime data; mounted at /app/data/pdfs in containers
  papers_per_category: 200 # Maximum number of papers to download per category (0 for unlimited)
  request_interval_seconds: 3 # Be polite to arXiv between new PDF requests
  # Categories to prioritize for PDF downloads - if empty, all papers in MongoDB will be considered
  process_categories: # used in download_pdfs.py - comment out categories you don't want to download
    - "cs.AI"
    - "cs.CV"
    - "cs.DB"
    - "cs.DS"
    - "cs.LG" 
    - "cs.MA"
    - "cs.NE"
    - "cs.RO"
    - "cs.SE"
  # Date filters for downloading PDFs
  download_date_filter:
    enabled: true         # Set to false to disable date filtering
    start_date: "2026-01-01" # Download papers published on or after this date (format: YYYY-MM-DD)
    end_date: "2026-03-31"   # Download papers published on or before this date (format: YYYY-MM-DD)
    sort_by_date: true    # Sort MongoDB query by published date

# Retired topic-modeling experiment. This is available only through the
# Docker Compose `legacy` profile and is not used by the research API/index.
bertopic:
  # MongoDB connection settings
  mongo:
    connection_string: "mongodb://mongodb:27017/"  # For Docker
    connection_string_local: "mongodb://localhost:27017/"  # For local development
    db_name: "arxiv_papers"
    papers_collection: "papers"  # Source collection
    topics_collection: "paper_bertopic_topics"  # Target collection for topics
  # Processing settings
  batch_size: 200  # Number of papers to process in each batch
  max_papers: 100000  # Maximum papers to process (0 for unlimited)
  # Category filter
  categories:
    - "cs.AI"
    - "cs.CV"
    - "cs.DB"
    - "cs.DS"
    - "cs.LG" 
    - "cs.MA"
    - "cs.NE"
    - "cs.RO"
    - "cs.SE"
  # Date filter
  date_filter:
    enabled: true
    start_date: "2026-01-01"  # Process papers published on or after this date
    end_date: "2026-03-31"    # Process papers published on or before this date

# Retired topic-modeling experiment. This is available only through the
# Docker Compose `legacy` profile and is not used by the research API/index.
top2vec:
  # MongoDB connection settings
  mongo:
    connection_string: "mongodb://mongodb:27017/"  # For Docker
    connection_string_local: "mongodb://localhost:27017/"  # For local development
    database: "arxiv_papers"
    papers_collection: "papers"  # Source collection
    topics_collection: "paper_top2vec_topics"  # Target collection for topics
  # Model settings
  min_count: 12  # Minimum word count (reduced from 5)
  speed: "learn"  # Speed vs accuracy tradeoff ('learn', 'deep-learn', 'fast-learn')
  workers: 8  # Number of worker threads
  embedding_model: "doc2vec"  # Embedding model to use (doc2vec is the default and always available)
  # Processing settings
  batch_size: 200  # Number of papers to process in each batch
  max_papers: 1000000  # Maximum papers to process (0 for unlimited)
  # Category filter
  categories:
    - "cs.AI"
    - "cs.CV"
    - "cs.DB"
    - "cs.DS"
    - "cs.LG" 
    - "cs.MA"
    - "cs.NE"
    - "cs.RO"
    - "cs.SE"
  # Date filter
  date_filter:
    enabled: true
    start_date: "2026-01-01"  # Process papers published on or after this date
    end_date: "2026-03-31"    # Process papers published on or before this date

# Filtered Kaggle corpus used for paper discovery.
kaggle_corpus:
  # Full Kaggle imports are filtered into a temporary collection, validated,
  # indexed, and atomically swapped into this name. The cleanup CLI is a dry
  # run unless --apply is provided.
  # For a future zero-downtime refresh, import the full dataset into a staging
  # collection and set import_collection to that name.
  import_collection: "arxiv_kaggle"
  collection_name: "arxiv_kaggle"
  # Required category selection comes from KAGGLE_RETAINED_CATEGORIES in .env.
  category_match: "any"
  # Category-only retention is the default. Enable this later only when a
  # rolling discovery window is intentional.
  date_filter:
    enabled: false
    start_date: "2021-01-01"
    end_date: "2026-03-31"
  # Destructive replacement stops when a surprising import or policy falls
  # outside this expected range.
  retention_guard:
    minimum_fraction: 0.01
    maximum_fraction: 0.30

# Paper-level metadata discovery remains separate from the evidence-backed
# research index. Physical collections include a corpus snapshot suffix and
# become queryable only after the stable alias is atomically updated.
discovery_index:
  collection_prefix: "arxiv_discovery_hybrid_v1"
  alias_name: "arxiv_discovery_current"
  schema_version: "1.0"
  embedding_model: "mxbai-embed-large:latest"
  # Benchmarked locally at ~31 papers/second; 512 provided no improvement.
  embedding_batch_size: 256
  source_collection: "arxiv_kaggle"
  # Only Kaggle papers whose exact versionless ID exists here are embedded.
  # The Kaggle collection itself is not modified by this intersection.
  eligibility_collection: "papers"
  eligibility_id_field: "base_arxiv_id"
  checkpoint_collection: "discovery_index_runs"
  query_prefix: "Represent this sentence for searching relevant passages: "
  retrieval_mode: "hybrid"
  hybrid:
    candidate_multiplier: 4
    candidate_minimum: 50
    dense_weight: 1.1
    sparse_weight: 1.0
    rrf_k: 60
    default_min_relevance: 0.05

# Kaggle Dataset Downloader settings
kaggle:
  # The official arXiv dataset on Kaggle (https://www.kaggle.com/datasets/Cornell-University/arxiv)
  dataset: "Cornell-University/arxiv"  # Kaggle dataset identifier
  version: "1"  # Dataset version number (usually 1 for most datasets)
  download_path: "X:/kaggle_arxiv"  # Base directory for downloads (use forward slashes)
  credentials:
    path: "secure/kaggle.json"  # Path to kaggle.json (create 'secure' directory if it doesn't exist)
  logging:
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  
  # IMPORTANT: Before using this script, you must:
  # 1. Accept the dataset's terms on Kaggle (visit the dataset page and click "I Understand and Accept")
  # 2. Create a 'secure' directory in your project root and add your kaggle.json file there
  # 3. Ensure you have sufficient disk space (the arXiv dataset is ~8GB)
  # 4. The 'secure' directory is in .gitignore to protect your credentials

# Logging settings
logging:
  level: "INFO"
  file: "logs/pipeline.log"

