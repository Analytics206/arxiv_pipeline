# ArXiv Pipeline Configuration

# MongoDB settings
mongo:
  connection_string: "mongodb://mongodb:27017/"
  connection_string_local: "mongodb://localhost:27017/"
  db_name: "arxiv_papers"

# Shared stateless AI services. Environment variables override these values.
ai_services:
  host_local: "localhost"
  host_docker: "host.docker.internal"
  ollama_port: 11434

# Agent-first paper analysis settings
analysis:
  collection_name: "paper_analyses"
  schema_version: "1.0"
  prompt_version: "agent-paper-v5"
  model: "qwen3.5:4b"
  context_length: 12288
  max_output_tokens: 4096
  # Used only after a response is confirmed truncated. Normal calls retain the
  # smaller settings above; the retry has room for long synthesis JSON.
  retry_context_length: 18432
  retry_max_output_tokens: 6144
  chunk_max_chars: 12000
  cache_directory: "data/analysis_cache"

# Rebuildable, agent-facing hybrid index over canonical MongoDB analyses.
research_index:
  collection_name: "research_knowledge_hybrid_v1"
  schema_version: "2.1"
  embedding_model: "mxbai-embed-large:latest"
  embedding_batch_size: 32
  query_prefix: "Represent this sentence for searching relevant passages: "
  retrieval_mode: "hybrid"
  hybrid:
    candidate_multiplier: 4
    candidate_minimum: 50
    dense_weight: 1.1
    sparse_weight: 1.0
    rrf_k: 60
    paper_diversity_penalty: 0.2
    # Excludes single-retriever leftovers by default. Callers can request 0 to
    # inspect every nearest neighbor while retaining normalized relevance.
    default_min_relevance: 0.05

# Bounded, resumable agent analysis after the larger PDF corpus is downloaded.
# One paper per category is a safe three-paper batch on the 8 GB GPU. Completed
# analysis identities are skipped, so each rerun advances to the next papers.
research_processing:
  process_categories:
    - "cs.AI"
    - "cs.CV"
    - "cs.LG"
  papers_per_category: 1
  
# Optional legacy graph settings. Neo4j is not part of the default agent-facing
# serving path and should be started only for a measured graph experiment.
neo4j:
  url: "bolt://neo4j:7687"
  url_local: "bolt://localhost:7687"
  user: "neo4j"
  password: "password"

# Qdrant settings
qdrant:
  url: "http://qdrant:6333"
  url_local: "http://localhost:6333"
  collection_name: "arxiv_papers"
  vector_size: 768  # For sentence-transformers models
  # Categories to prioritize for vector storage - these will be processed into Qdrant
  process_categories: # used in sync_qdrant.py
    - "cs.AI"
    # - "cs.CV" 
    # - "cs.LG"
  papers_per_category: 99 # Maximum number of papers to process into vectors per category (0 for unlimited)
  default_pdf_path: "data/pdfs" # Portable project-local PDF storage
  gpu_enabled: false # Disable GPU for vector operations
  gpu_device: 1 # Use the second GPU (index 1)
  tracking:
    enabled: true # Whether to track processed PDFs
    collection_name: "vector_processed_pdfs" # MongoDB collection to store tracking information
    sync_with_qdrant: true # Whether to sync tracking with actual Qdrant contents

# Qdrant Paper Summary Vector settings
paper_summaries:
  enabled: true
  qdrant:
    collection_name: "papers_summary" # Name of the Qdrant collection for paper summaries
    vector_size: 768  # For sentence-transformers models
  # Categories to prioritize for summary vector processing
  process_categories: # used in sync_summary_vectors.py
    - "cs.AI"
    # - "cs.LG"
  papers_per_category: 10 # Maximum number of papers to process into summary vectors per category (0 for unlimited)
  date_filter:
    enabled: true         # Set to false to disable date filtering
    start_date: "2026-01-01" # Process papers published on or after this date (format: YYYY-MM-DD)
    end_date: "2026-07-31"   # Process papers published on or before this date (format: YYYY-MM-DD)
    sort_by_date: true    # Sort MongoDB query by published date
  # Tracking settings for processed summaries
  tracking:
    enabled: true # Whether to track processed summaries
    collection_name: "vector_processed_summary" # MongoDB collection to store tracking information
    sync_with_qdrant: true # Whether to sync tracking with actual Qdrant contents

