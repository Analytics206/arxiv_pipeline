  sort_by: "submittedDate"
  sort_order: "descending"
  max_iterations: 500 # Number of times to loop the pipeline for each category above
  rate_limit_seconds: 10 # seconds to wait between api calls
  start_date: "2026-01-01" # start_date is used in arxiv api call and save pdfs filters
  end_date: "2026-07-31" # end_date is not used in arxiv api call, only have start_date, used when saving pdfs
  max_no_papers: 25 # Maximum number of no paper fetches before breaking loop for category
# Embedding model settings
embedding:
  model_name: "all-MiniLM-L6-v2"  # Smaller model to start with
  batch_size: 200

# 265,979 papers in arxiv_papers.papers
# PDF storage settings
pdf_storage:
  directory: "data/pdfs" # ignored runtime data; mounted at /app/data/pdfs in containers
  papers_per_category: 200 # Maximum number of papers to download per category (0 for unlimited)
  request_interval_seconds: 1 # Be polite to arXiv between new PDF requests
  # Categories to prioritize for PDF downloads - if empty, all papers in MongoDB will be considered
  process_categories: # used in download_pdfs.py - comment out categories you don't want to download
    - "cs.AI"
